<section class="app-top-bar">
    <header>
        @let username = user()?.username;
        @if (username) {
        Logged in as: {{ username }}
        }
    </header>
    <nav>
        @if (!!user()) {
        <button (click)="logout()">
            <span class="material-symbols-outlined" title="logout">
                logout
            </span>
        </button>
        }
    </nav>
</section>
<main #mainContent>
    <router-outlet></router-outlet>
</main>
