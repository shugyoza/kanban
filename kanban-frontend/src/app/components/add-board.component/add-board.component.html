<form class="add-board-title" (submit)="submitNewBoardTitle($event)">
    <input type="text" id="username" placeholder="New board title..." [formField]="newBoardTitleForm" />
    <button
        type="submit"
        title="Add new board title"
        [disabled]="newBoardTitleForm().invalid()">
        <span class="material-symbols-outlined">
            add
        </span>
    </button>
</form>
